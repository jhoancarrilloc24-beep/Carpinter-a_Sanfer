<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!-- Vinculación del archivo CSS externo -->
    <link rel="stylesheet" href="../css/registre_style.css">
</head>
<body>
    <!-- Logo de la página -->
    <img src="../assets/logo_campinteria.jpeg" alt="Logo oficial de Carpintería" class="logo">

    <!-- Elementos decorativos (círculos de fondo) -->
    <div class="circulo-contenido circulo-grande-1"></div>
    <div class="circulo-contenido circulo-grande-2"></div>
    <div class="circulo-contenido circulo-mediano mediano-1"></div> 
    <div class="circulo-contenido circulo-mediano mediano-2"></div> 
    <div class="circulo-contenido circulo-mediano mediano-3"></div>
    <div class="circulo-contenido circulo-mediano mediano-4"></div>
    <div class="circulo-contenido circulo-mediano mediano-5"></div>
    <div class="circulo-contenido circulo-mediano mediano-6"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-1"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-2"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-3"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-4"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-5"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-6"></div>
    <div class="circulo-contenido circulo-pequeno pequeno-7"></div>

    <main class="register_container">

        <form action="#" method="POST" id="formulario_registro" name="formulario_registro" class="formulario_registro">

            <!-- Ícono de usuario superior en halo circular -->
            <div class="avatar-container">
                <div class="avatar-ring">
                    <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

            <!-- Título -->
            <h1 class="titulo_formulario">Crear cuenta</h1>

            <!-- Selector de rol -->
            <div class="selector-rol">
                <button type="button" class="btn-rol activo" id="btn-cliente" onclick="seleccionarRol('cliente')">
                    Cliente
                </button>
                <button type="button" class="btn-rol" id="btn-admin" onclick="seleccionarRol('admin')">
                    Administrador
                </button>
            </div>

            <!-- Enlace de regreso al login -->
            <a href="login.html" class="enlace-login">¿Tienes cuenta?</a>

            <!-- Envoltorio Grid para los inputs de 2 columnas -->
             <div class="grid-inputs">

                <div class="grupo-input">
                    <label for="nombre" class="label-form">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="input-form" placeholder="Ingresa tu nombre" required>
                </div>
                
                <div class="grupo-input">
                    <label for="apellido" class="label-form">Apellido</label>
                    <input type="text" id="apellido" name="apellido" class="input-form" placeholder="Ingresa tu apellido" required>
                </div>
                
                <div class="grupo-input">
                    <label for="telefono" class="label-form">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" class="input-form" placeholder="Ingresa tu teléfono" required>
                </div>
                
                <div class="grupo-input">
                    <label for="direccion" class="label-form">Dirección</label>
                    <input type="text" id="direccion" name="direccion" class="input-form" placeholder="Ingresa tu dirección" required>
                </div>
                
            <!-- Campo de Contraseña con Ojito Toggle -->
            <div class="grupo-input">
                <label for="password" class="label-form">Contraseña</label>
                <div class="input-password-wrapper">
                    <input type="password" id="password" name="password" class="input-form" placeholder="Ingresa una contraseña" required>
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Mostrar u ocultar contraseña">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle class="eye-open" cx="12" cy="12" r="3"></circle>
                            <path class="eye-closed" style="display: none;" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line class="eye-closed" style="display: none;" x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
                
                <div class="grupo-input">
                    <label for="email" class="label-form">Correo</label>
                    <input type="email" id="email" name="email" class="input-form" placeholder="Ingresa un correo electrónico" required>
                </div>
            </div>
            
            <!-- Campo especial para Administrador (Ocupa el centro abajo) se muestra al precionar Administrador-->
            <div class="grupo-input grupo-admin" id="grupo-clave-admin" style="display: none;">
                <label for="clave-admin" class="label-form">Clave de administrador</label>
                <input type="password" id="clave-admin" name="clave_admin" class="input-form" placeholder="Ingresa la clave del taller">
            </div>

            <button type="submit" id="btn-registrarse" name="registrarse" class="btn-submit">
                Registrarse
            </button>
        </form>
        
        <!-- Pie de página -->
        <footer class="footer-note">
            &copy; <span id="year"></span> Carpintería Sanfer — Todos los derechos reservados
        </footer>

    </main>


        <!-- Script de control para ojito e inicialización del año -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const yearSpan = document.getElementById('year');
            if (yearSpan) yearSpan.textContent = new Date().getFullYear();
        });

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            const openIconElements = btn.querySelectorAll('.eye-open');
            const closedIconElements = btn.querySelectorAll('.eye-closed');

            if (isPassword) {
                openIconElements.forEach(el => el.style.display = 'none');
                closedIconElements.forEach(el => el.style.display = 'inline');
            } else {
                openIconElements.forEach(el => el.style.display = 'inline');
                closedIconElements.forEach(el => el.style.display = 'none');
            }
        }
    </script>
    
    <script src="../js/register_fuction.js"></script>
    <script src="../js/admin_keys.js"></script>

</body>
</html>
