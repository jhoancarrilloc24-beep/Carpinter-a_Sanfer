<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de compra | Carpintería Sanfer</title>
  <link rel="stylesheet" href="../css/lista_carrito.css" />
</head>
<body>
  <main class="cart-page">
    <section class="cart-card">
      <header class="cart-header">
        <div>
          <span class="eyebrow">CARRITO</span>
          <h1>Lista de compra</h1>
        </div>
        <a class="secondary-btn" href="producto_detalle.html">Seguir comprando</a>
      </header>

      <div class="cart-layout">
        <div class="items-panel">
          <div id="cartItems" class="cart-items-list"></div>
        </div>

        <aside class="summary-panel">
          <h2>Resumen</h2>
          <div class="summary-row">
            <span>Productos</span>
            <strong id="itemsCount">0</strong>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotalValue">$ 0 COP</strong>
          </div>
          <div class="summary-row shipping">
            <span>Envío</span>
            <strong>Gratis</strong>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <strong id="totalValue">$ 0 COP</strong>
          </div>

          <button id="btnPago" class="primary-btn" type="button">Continuar al pago</button>
        </aside>
      </div>
    </section>
  </main>

  <script src="../js/lista_carrito.js"></script>
</body>
</html>
